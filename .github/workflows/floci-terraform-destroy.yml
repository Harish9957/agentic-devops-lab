name: floci-terraform-destroy

# Manual-only: destroys against Floci. Never runs on push — same human-gate reasoning as
# floci-terraform-apply.yml, with a distinct confirmation word so the two can't be triggered by
# muscle memory. Each run gets a brand-new, empty Floci container (no state persists between CI
# runs), so a destroy-only job would have nothing to destroy and would prove nothing. This job
# applies first, confirms the resources exist, then destroys and confirms they're gone — the same
# plan-destroy-then-verify shape as this use case's local spec/teardown.md, just self-contained so
# it's a meaningful check in CI rather than a trivial "0 destroyed".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to run terraform destroy against Floci'
        required: true

jobs:
  destroy:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    steps:
      - name: Check confirmation input
        if: ${{ github.event.inputs.confirm != 'destroy' }}
        run: |
          echo "confirm input must be exactly 'destroy' — got '${{ github.event.inputs.confirm }}'" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566 > /dev/null && exit 0
            sleep 1
          done
          echo "Floci did not become ready in time" >&2
          exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Same reasoning as floci-terraform-plan.yml: this container starts empty, so the
      # state-backend fixtures terraform-state-backend normally creates don't exist yet.
      - name: Seed Floci state-backend fixtures (not a terraform apply)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url=http://localhost:4566 s3api create-bucket \
            --bucket agentic-devops-lab-tfstate --region us-east-1
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name agentic-devops-lab-tflocks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: terraform init
        working-directory: 02-terraform-vpc
        run: terraform init -backend-config=backend-floci.hcl

      # Something has to exist before there's anything meaningful to destroy — see the top comment.
      - name: terraform apply (create what this run will destroy)
        working-directory: 02-terraform-vpc
        run: terraform apply -var="use_floci=true" -auto-approve

      - name: Verify VPC exists before destroy
        id: before
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        working-directory: 02-terraform-vpc
        run: |
          VPC_ID=$(terraform output -raw vpc_id)
          aws --endpoint-url=http://localhost:4566 ec2 describe-vpcs --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].State' --output text | grep -qx available
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

      # Matches spec/teardown.md's local convention: review the destroy plan before destroying.
      - name: terraform plan -destroy (review before destroying)
        working-directory: 02-terraform-vpc
        run: terraform plan -destroy -var="use_floci=true"

      - name: terraform destroy
        working-directory: 02-terraform-vpc
        run: terraform destroy -var="use_floci=true" -auto-approve

      # Matches spec/teardown.md's completion gate: confirm the VPC ID no longer resolves, rather
      # than trusting terraform destroy's own exit code.
      - name: Verify VPC no longer exists
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if aws --endpoint-url=http://localhost:4566 ec2 describe-vpcs \
               --vpc-ids "${{ steps.before.outputs.vpc_id }}" > /dev/null 2>&1; then
            echo "VPC ${{ steps.before.outputs.vpc_id }} still exists after destroy" >&2
            exit 1
          fi
          echo "VPC ${{ steps.before.outputs.vpc_id }} confirmed gone after destroy (Floci, this run only)." >> "$GITHUB_STEP_SUMMARY"
