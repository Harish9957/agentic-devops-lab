name: floci-terraform-plan

# Plan only, against Floci — no apply. Matches this repo's rule that terraform apply/destroy
# always needs an explicit, per-run human go-ahead, never automation.
on:
  push:
    paths:
      - "02-terraform-vpc/**"
      - ".github/workflows/floci-terraform-plan.yml"
  workflow_dispatch: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566 > /dev/null && exit 0
            sleep 1
          done
          echo "Floci did not become ready in time" >&2
          exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Each CI run gets a brand-new, empty Floci container, so the S3 bucket + DynamoDB lock
      # table that terraform-state-backend normally creates don't exist yet — terraform init's
      # backend check fails without them. Seeding just these two fixtures directly (ubuntu-latest
      # ships the AWS CLI preinstalled) avoids running `terraform apply` in automation, which this
      # repo's rule prohibits even against Floci. Names must match terraform-state-backend's
      # variables.tf defaults and backend-floci.hcl.
      - name: Seed Floci state-backend fixtures (not a terraform apply)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url=http://localhost:4566 s3api create-bucket \
            --bucket agentic-devops-lab-tfstate --region us-east-1
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name agentic-devops-lab-tflocks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: terraform init
        working-directory: 02-terraform-vpc
        run: terraform init -backend-config=backend-floci.hcl

      - name: terraform plan
        working-directory: 02-terraform-vpc
        run: terraform plan -var="use_floci=true"
