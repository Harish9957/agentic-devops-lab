name: floci-terraform-apply

# Manual-only: applies against Floci. Never runs on push — workflow_dispatch is the human gate this
# repo's rule requires for every apply, and the typed confirmation input is a second, explicit check
# against an accidental click. Same-job Floci container, so nothing here persists past the run; this
# demonstrates the apply path in CI, it isn't how state for this use case is actually managed.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm you want to run terraform apply against Floci'
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    steps:
      - name: Check confirmation input
        if: ${{ github.event.inputs.confirm != 'apply' }}
        run: |
          echo "confirm input must be exactly 'apply' — got '${{ github.event.inputs.confirm }}'" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566 > /dev/null && exit 0
            sleep 1
          done
          echo "Floci did not become ready in time" >&2
          exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Same reasoning as floci-terraform-plan.yml: this container starts empty, so the
      # state-backend fixtures terraform-state-backend normally creates don't exist yet.
      - name: Seed Floci state-backend fixtures (not a terraform apply)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url=http://localhost:4566 s3api create-bucket \
            --bucket agentic-devops-lab-tfstate --region us-east-1
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name agentic-devops-lab-tflocks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: terraform init
        working-directory: 02-terraform-vpc
        run: terraform init -backend-config=backend-floci.hcl

      - name: terraform apply
        working-directory: 02-terraform-vpc
        run: terraform apply -var="use_floci=true" -auto-approve

      # Verifies the resources actually exist rather than trusting terraform's own exit code —
      # matches this repo's rule that a hard pass/fail check is the real completion gate.
      - name: Verify VPC and subnets exist
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        working-directory: 02-terraform-vpc
        run: |
          VPC_ID=$(terraform output -raw vpc_id)
          aws --endpoint-url=http://localhost:4566 ec2 describe-vpcs --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].State' --output text | grep -qx available

          SUBNET_IDS=$(terraform output -json public_subnet_ids | jq -r '.[]')
          SUBNET_IDS="$SUBNET_IDS $(terraform output -raw private_subnet_id)"
          for SUBNET_ID in $SUBNET_IDS; do
            aws --endpoint-url=http://localhost:4566 ec2 describe-subnets --subnet-ids "$SUBNET_ID" \
              --query 'Subnets[0].State' --output text | grep -qx available
          done

          echo "VPC and all subnets confirmed available (Floci, this run only)." >> "$GITHUB_STEP_SUMMARY"
